<template>
  <template lwc:if={visible}>
    <lightning-card title={cardTitle} icon-name="standard:data_streams">
      <lightning-button
        slot="actions"
        label="Refresh"
        icon-name="utility:refresh"
        onclick={handleRefresh}
        disabled={working}
      ></lightning-button>
      <div class="slds-p-horizontal_medium">
        <p class="slds-text-color_weak slds-m-bottom_small">{intro}</p>
        <template lwc:if={status.reason}>
          <p class="slds-text-color_error slds-m-bottom_small">
            {status.reason}
          </p>
        </template>
        <template lwc:if={lastMessage}>
          <p class="slds-m-bottom_small" role="status">{lastMessage}</p>
        </template>
        <template lwc:if={status.busy}>
          <p class="slds-m-bottom_small slds-text-color_weak" role="status">
            <lightning-icon
              icon-name="utility:spinner"
              size="xx-small"
              class="slds-m-right_x-small"
              alternative-text="Working"
            ></lightning-icon>
            Working in the background. This page refreshes by itself.
          </p>
        </template>
        <ul class="slds-has-dividers_bottom-space">
          <template for:each={rows} for:item="row">
            <li key={row.key} class="slds-item slds-p-vertical_small">
              <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                  <p class="slds-text-heading_small">{row.label}</p>
                  <p class="slds-text-color_weak">{row.description}</p>
                  <template lwc:if={row.message}>
                    <p class="slds-text-color_error">{row.message}</p>
                  </template>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-medium-size_2-of-12">
                  <lightning-badge
                    label={row.stateLabel}
                    class={row.badgeClass}
                  ></lightning-badge>
                  <p class="slds-text-color_weak">{row.recordsLabel}</p>
                </div>
                <div
                  class="slds-col slds-size_1-of-2 slds-medium-size_3-of-12 slds-text-align_right"
                >
                  <template lwc:if={row.confirming}>
                    <lightning-button
                      variant="destructive"
                      label="Remove"
                      data-pack={row.key}
                      data-action="confirm"
                      onclick={handleConfirmReset}
                    ></lightning-button>
                    <lightning-button
                      label="Cancel"
                      class="slds-m-left_x-small"
                      onclick={handleCancelReset}
                    ></lightning-button>
                  </template>
                  <template lwc:else>
                    <lightning-button
                      variant="brand"
                      label="Load"
                      data-pack={row.key}
                      data-action="load"
                      onclick={handleLoad}
                      disabled={row.loadDisabled}
                    ></lightning-button>
                    <lightning-button
                      label="Reset"
                      class="slds-m-left_x-small"
                      data-pack={row.key}
                      data-action="reset"
                      onclick={handleAskReset}
                      disabled={row.resetDisabled}
                    ></lightning-button>
                  </template>
                </div>
              </div>
            </li>
          </template>
        </ul>
        <template lwc:if={hasCounts}>
          <p class="slds-text-heading_small slds-m-top_medium">
            Records created ({status.total})
          </p>
          <ul class="slds-grid slds-wrap slds-m-top_x-small">
            <template for:each={status.counts} for:item="count">
              <li
                key={count.label}
                class="slds-col slds-size_1-of-2 slds-medium-size_1-of-3 slds-text-color_weak"
              >
                {count.label}: {count.count}
              </li>
            </template>
          </ul>
        </template>
      </div>
    </lightning-card>
  </template>
</template>
