<template>
  <lightning-card title={title} icon-name="standard:timeline">
    <lightning-button-icon
      slot="actions"
      icon-name="utility:refresh"
      alternative-text="Refresh"
      onclick={load}
    ></lightning-button-icon>
    <div class="slds-p-horizontal_medium">
      <template lwc:if={error}>
        <div
          class="slds-notify slds-notify_alert slds-alert_error"
          role="alert"
        >
          {error}
        </div>
      </template>
      <template lwc:if={loading}>
        <lightning-spinner
          alternative-text="Loading"
          size="small"
        ></lightning-spinner>
      </template>
      <template lwc:if={hasTasks}>
        <div class="pms-gantt">
          <div class="pms-row pms-header">
            <div class="pms-name">Task</div>
            <div class="pms-track">
              <template for:each={scale} for:item="m">
                <span key={m.key} class="pms-mark" style={m.style}
                  >{m.label}</span
                >
              </template>
            </div>
          </div>
          <template for:each={rows} for:item="r">
            <div key={r.key} class="pms-row">
              <div class={r.nameCls} title={r.tooltip}>
                <a data-id={r.id} onclick={open}>{r.name}</a>
                <div class="pms-assignee">{r.assignee}</div>
              </div>
              <div class="pms-track">
                <span class="pms-today" style={todayStyle}></span>
                <template lwc:if={r.hasDates}>
                  <template lwc:if={r.isMilestone}>
                    <span
                      class="pms-diamond"
                      style={r.diamondStyle}
                      title={r.tooltip}
                    ></span>
                  </template>
                  <template lwc:else>
                    <div
                      class={r.barCls}
                      style={r.barStyle}
                      title={r.tooltip}
                      data-id={r.id}
                      onclick={startEdit}
                    >
                      <div class="pms-progress" style={r.progressStyle}></div>
                    </div>
                  </template>
                </template>
              </div>
            </div>
          </template>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
          Click a bar to change its dates. Red bars are late.
        </p>
      </template>
      <template lwc:elseif={data}>
        <p class="slds-text-color_weak slds-p-around_medium">
          No tasks yet. Add Project Tasks with start and end dates.
        </p>
      </template>
    </div>

    <template lwc:if={editing}>
      <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        class="slds-modal slds-fade-in-open"
      >
        <div class="slds-modal__container">
          <div class="slds-modal__header">
            <h2 class="slds-text-heading_medium">{editing.name}</h2>
          </div>
          <div class="slds-modal__content slds-p-around_medium">
            <lightning-input
              type="date"
              label="Start"
              name="editStart"
              value={editStart}
              onchange={handleEdit}
            ></lightning-input>
            <lightning-input
              type="date"
              label="End"
              name="editEnd"
              value={editEnd}
              onchange={handleEdit}
            ></lightning-input>
          </div>
          <div class="slds-modal__footer">
            <lightning-button
              label="Cancel"
              onclick={cancelEdit}
            ></lightning-button>
            <lightning-button
              class="slds-m-left_x-small"
              variant="brand"
              label="Save"
              onclick={saveEdit}
            ></lightning-button>
          </div>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </lightning-card>
</template>
