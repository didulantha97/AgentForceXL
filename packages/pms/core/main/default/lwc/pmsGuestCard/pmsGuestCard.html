<template>
  <template lwc:if={hasContact}>
    <lightning-card title="Guest" icon-name="standard:contact">
      <div class="slds-p-horizontal_medium slds-is-relative">
        <template lwc:if={showLoading}>
          <lightning-spinner
            alternative-text="Loading guest information"
            size="small"
          ></lightning-spinner>
        </template>
        <template lwc:if={error}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error"
            role="alert"
          >
            {error}
          </div>
        </template>
        <template lwc:if={showContent}>
          <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
            <span class="slds-text-heading_small slds-m-right_x-small"
              >{card.name}</span
            >
            <template lwc:if={hasVip}>
              <span class="slds-badge slds-theme_warning slds-m-right_x-small">
                <lightning-icon
                  icon-name="utility:favorite"
                  size="xx-small"
                  alternative-text="VIP guest"
                  class="slds-m-right_xx-small"
                ></lightning-icon>
                {vipLabel}
              </span>
            </template>
            <span class="slds-badge">
              <lightning-icon
                icon-name={idIcon}
                size="xx-small"
                alternative-text=""
                class="slds-m-right_xx-small"
              ></lightning-icon>
              {idText}
            </span>
          </div>
          <template lwc:if={hasDietary}>
            <div class="callout slds-p-left_x-small slds-m-top_x-small">
              <lightning-icon
                icon-name="utility:food_and_drink"
                size="x-small"
                alternative-text="Dietary"
                class="slds-m-right_xx-small"
              ></lightning-icon>
              <span class="slds-text-title">Dietary:</span> {card.dietary}
            </div>
          </template>
          <template lwc:if={hasAccess}>
            <div class="callout slds-p-left_x-small slds-m-top_x-small">
              <lightning-icon
                icon-name="utility:user"
                size="x-small"
                alternative-text="Accessibility"
                class="slds-m-right_xx-small"
              ></lightning-icon>
              <span class="slds-text-title">Accessibility:</span>
              {card.accessibilityNeeds}
            </div>
          </template>
          <template lwc:if={hasPreferences}>
            <ul class="slds-m-top_x-small">
              <template for:each={preferences} for:item="p">
                <li key={p.key} class="slds-text-body_small">{p.text}</li>
              </template>
            </ul>
          </template>
          <template lwc:if={showBalance}>
            <p class="slds-m-top_x-small">
              <span class="slds-text-color_weak">Balance due:</span>
              <lightning-formatted-number
                value={card.balanceDue}
                format-style="currency"
                currency-code={currencyCode}
              ></lightning-formatted-number>
            </p>
          </template>
          <p class="slds-m-top_x-small slds-m-bottom_small">
            <a href="#" onclick={handleOpen}>Open Guest 360</a>
          </p>
        </template>
      </div>
    </lightning-card>
  </template>
</template>
